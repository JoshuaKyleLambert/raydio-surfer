[package]
name = "RaydioSurfer"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.13.4", features = ["stream"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
raylib = { version = "6.0", features = ["raygui"] }
radiobrowser = { version = "0.6.1", features = ["blocking"] }
serde_json = "1.0"
serde = "1.0.229"
tokio = { version = "1.0", features = ["full"] }
directories = "6.0.0"

[lints.rust]
warnings = "deny"
