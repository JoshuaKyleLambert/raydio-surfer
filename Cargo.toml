[package]
name = "RaydioSurfer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["stream"] }
rodio = { version = "0.23.0", features = ["symphonia-all"] }
raylib = { version = "6.0.0", features = ["raygui"] }
radiobrowser = { version = "0.6.1", features = ["blocking"] }
serde_json = "1.0.154"
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["full"] }
directories = "6.0.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[lints.rust]
warnings = "deny"
